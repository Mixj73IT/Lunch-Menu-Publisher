[package]
name = "lunch-menu-publisher"
version = "1.0.1"
description = "Monthly Lunch Menu Publisher"
authors = ["Jr. Haynes"]
license = "MIT"
repository = "https://github.com/Mixj73IT/lunch-menu-publisher"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
tauri = { version = "2.11.5", features = ["process-relaunch-dangerous-allow-symlink-macos"] }
serde_json = "1.0"
lettre = { version = "0.11", default-features = false, features = ["builder", "smtp-transport", "rustls-tls"] }
dotenvy = "0.15"
base64 = "0.23"
rfd = "0.15"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
